name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and build
      run: |
        npm install
        npm run build

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: GPC-SHI-Windows-EXE
        path: |
          dist/*.exe
          out/*.exe
